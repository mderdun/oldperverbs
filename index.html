        <style type="text/css">
            /* <![CDATA[ */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                color: #fff;
                margin: 0 0 0 18pt;
                font-family: "Trattatello", fantasy;
                font-size: 48pt;
                font-stretch: extra-expanded;
            }
            a {
                color: #fff;
                text-decoration: none;
            }
            .video-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                overflow: hidden;
            }
            .video-container iframe {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 177.77777778vh;
                height: 56.25vw;
                min-width: 100%;
                min-height: 100%;
                transform: translate(-50%, -50%);
                pointer-events: none;
            }
            .content-wrapper {
                position: relative;
                z-index: 1;
            }
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 0;
            }
            /* ]]> */
        </style>
        <script type="text/javascript">
            var t = 0;
            // All but the last character ends up as the beginning of the output.
            // The last character is tacked onto the very end.
            var left = [
                "Wisdom has built her house.",
                "I love those who love me,.",
                "My fruit is better than gold, pure gold,.",
                "Drink water from your own cistern,!",
                "May your fountain be blessed,.",
                "At the end of your life you will groan... .",
                "The fear of the LORD prolongs life,.",
                "Be assured that the wicked will not go unpunished,!",
                "A righteous man regards the life of his animal,!",
                "Anxiety weighs down the heart of a man,.",
                "A wise son heeds his father’s discipline,.",
                "Disaster pursues sinners,.",
                "How can anyone understand his own way?",
            ];
            // This ends up as the end of the output, except for the very last character.
            var right = [
                "somewhere",
                "in my pants",
                "to Rome",
                "to the jungle",
                "in the Cloud",
                "ever ever on",
                "on the British Empire",
                "home",
                "into Mordor",
                "an island",
                "my country",
                "to the hand",
                "a series of tubes",
            ];
            function rand_range(max) {
                "use strict";
                return Math.floor(Math.random() * (max + 1));
            }
            function litany() {
                "use strict";
                var last,
                    text,
                    l,
                    r,
                    main = document.getElementById("main");
                if (t <= 24) {
                    t += 1;
                } else {
                    main.removeChild(
                        document.getElementById("main").firstChild,
                    );
                }
                last = document.createElement("div");
                l = rand_range(left.length - 1);
                r = rand_range(right.length - 2);
                if (r >= l) {
                    r += 1;
                }
                text =
                    left[l].slice(0, left[l].length - 1) +
                    " " +
                    right[r] +
                    left[l].slice(-1);
                last.appendChild(document.createTextNode(text));
                main.appendChild(last);

                window.scrollTo({
                    top: document.documentElement.scrollHeight,
                    behavior: "smooth",
                });
            }
            function produce_litany() {
                "use strict";
                litany();

                const randomInterval = () => Math.random() * 3000 + 2000;

                (function loop() {
                    litany();
                    setTimeout(loop, randomInterval());
                })();
            }
        </script>
        <title>Old Perverbs</title>
    </head>
    <body onload="produce_litany();">
        <div class="overlay"></div>
        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/BF2hgH3TC9U?autoplay=1&mute=1&loop=1&controls=0&playlist=BF2hgH3TC9U"
                title="YouTube video player"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                modestbranding="1"
                showinfo="0"
                rel="0"
            >
            </iframe>
        </div>
        <div class="content-wrapper">
            <div
                style="
                    float: right;
                    background: rgba(153, 153, 153, 0.5);
                    margin-left: 6px;
                    border-left: thin #fff solid;
                    border-bottom: thin #fff solid;
                    padding: 9px;
                "
            >
                <div>
                    <span style="text-decoration: line-through">Modern</span>
                    Old Perverbs<br />
                    <span style="text-decoration: line-through"
                        >Nick Montfort</span
                    >
                    Miki Derdun
                </div>
            </div>
            <div
                id="main"
                style="
                    padding-top: 1rem;
                    padding-right: 3rem;
                    padding-left: 3rem;
                    padding-bottom: 1rem;
                    text-shadow: 1px 0 2rem lavenderblush;
                "
            ></div>
        </div>
    </body>
